# Kotodama dictation + screenshot tools keybindings — classic hyprlang version.
#
# For Hyprland running the classic hyprland.conf format, i.e. `hyprctl eval "return 1"`
# says "eval is only supported with the lua config manager". If it prints 1 instead,
# your Hyprland uses the Lua config manager — use hyprland-keybindings.lua.
#
# Save this as ~/.config/hypr/kotodama.conf and add one line to ~/.config/hypr/hyprland.conf:
#     source = ~/.config/hypr/kotodama.conf
#
# Edit the two paths below to wherever you cloned this project. Use an absolute
# path — a quoted "~/..." is not expanded by the shell that runs these commands.

$kotodamaDir = /home/YOUR_USER/dev/personal/kotodama
$kotodamaPy = /home/YOUR_USER/dev/personal/kotodama/.venv/bin/python

# Every path is double-quoted so a project directory containing a space still works.
bind = SUPER, D, exec, "$kotodamaPy" "$kotodamaDir/dictate.py" toggle          # Dictation: record / transcribe to clipboard
bind = SUPER, A, exec, "$kotodamaDir/screenshot.sh"                            # Screenshot: annotate and copy
bind = SUPER SHIFT, V, exec, "$kotodamaDir/clip-picker.sh"                     # Browse recent screenshots (clipboard history)

bind = SUPER, R, exec, "$kotodamaPy" "$kotodamaDir/session.py" toggle          # Session: start / end (record + screenshot)
bind = SUPER, I, exec, "$kotodamaPy" "$kotodamaDir/session.py" screenshot      # Session: add screenshot
bind = SUPER SHIFT, I, exec, "$kotodamaPy" "$kotodamaDir/session.py" split     # Session: split transcript segment
bind = SUPER, O, exec, "$kotodamaPy" "$kotodamaDir/session_browser.py"         # Session: browse and copy
